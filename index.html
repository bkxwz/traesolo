<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素风机甲对战</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
        }

        h1 {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        #gameCanvas {
            border: 4px solid #00ff88;
            box-shadow: 0 0 20px #00ff88, inset 0 0 50px rgba(0, 255, 136, 0.1);
            background: #0a0a0a;
        }

        .controls {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            color: #fff;
            font-size: 10px;
        }

        .player-controls {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border: 2px solid #00ff88;
            border-radius: 8px;
        }

        .player-controls h3 {
            color: #00ff88;
            margin-bottom: 10px;
        }

        .controls ul {
            list-style: none;
            padding: 0;
            margin: 0;
            line-height: 1.8;
        }

        .game-info {
            display: flex;
            gap: 60px;
            margin-bottom: 15px;
        }

        .health-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 4px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444 0%, #ff8800 50%, #00ff88 100%);
            transition: width 0.3s ease;
        }

        .player-name {
            color: #fff;
            font-size: 12px;
            margin-bottom: 5px;
        }

        #winner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border: 4px solid #00ff88;
            border-radius: 10px;
            color: #00ff88;
            font-size: 24px;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 0 30px #00ff88;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 15px 30px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            color: #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restartBtn:hover {
            background: #00cc6a;
            box-shadow: 0 0 20px #00ff88;
        }

        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    </style>
</head>
<body>
    <h1>MECHA ARENA</h1>
    
    <div class="game-info">
        <div>
            <div class="player-name">PLAYER 1</div>
            <div class="health-bar">
                <div id="player1Health" class="health-fill" style="width: 100%"></div>
            </div>
        </div>
        <div>
            <div class="player-name">PLAYER 2</div>
            <div class="health-bar">
                <div id="player2Health" class="health-fill" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
        <div class="player-controls">
            <h3>PLAYER 1</h3>
            <ul>
                <li>W - 向上移动</li>
                <li>S - 向下移动</li>
                <li>A - 向左移动</li>
                <li>D - 向右移动</li>
                <li>J - 攻击</li>
                <li>K - 防御</li>
            </ul>
        </div>
        <div class="player-controls">
            <h3>PLAYER 2</h3>
            <ul>
                <li>↑ - 向上移动</li>
                <li>↓ - 向下移动</li>
                <li>← - 向左移动</li>
                <li>→ - 向右移动</li>
                <li>NUM 1 - 攻击</li>
                <li>NUM 2 - 防御</li>
            </ul>
        </div>
    </div>

    <div id="winner">
        <div id="winnerText"></div>
        <button id="restartBtn">重新开始</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
